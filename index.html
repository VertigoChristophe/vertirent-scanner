<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VertiRENT Live Scanner</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { margin: 0; background: #090d16; color: #fff; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; height: 100vh; }
        header { padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; background: #0f172a; border-bottom: 1px solid #1e293b; gap: 8px; flex-wrap: wrap; }
        select { background: #1e293b; color: #fff; border: 1px solid #334155; padding: 6px 8px; border-radius: 6px; font-size: 13px; max-width: 170px; }
        .mode-toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; background: #1e293b; padding: 6px 10px; border-radius: 6px; border: 1px solid #334155; cursor: pointer; user-select: none; }
        .mode-toggle input { accent-color: #3b82f6; width: 15px; height: 15px; margin: 0; }
        button { background: #ef4444; color: #fff; border: none; padding: 7px 12px; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; }
        #reader { width: 100%; flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .footer-bar { background: #0f172a; border-top: 1px solid #1e293b; padding: 12px 16px; text-align: center; }
        #status-text { font-size: 13px; color: #94a3b8; margin: 0; }
        #last-scanned { font-size: 14px; font-weight: bold; color: #4ade80; margin: 4px 0 0 0; min-height: 20px; }
    </style>
</head>
<body>
    <header>
        <select id="camera-select" onchange="switchCamera()"></select>
        <label class="mode-toggle" title="Laat venster open voor meerdere scans">
            <input type="checkbox" id="continuous-mode">
            <span>Doorlopend</span>
        </label>
        <button onclick="closeScanner()">Klaar / Sluiten</button>
    </header>
    <div id="reader"></div>
    <div class="footer-bar">
        <p id="status-text">Camera wordt gestart...</p>
        <p id="last-scanned"></p>
    </div>

    <script>
        const html5QrCode = new Html5Qrcode("reader", {
            formatsToSupport: [
                Html5QrcodeSupportedFormats.CODE_128,
                Html5QrcodeSupportedFormats.CODE_39,
                Html5QrcodeSupportedFormats.EAN_13,
                Html5QrcodeSupportedFormats.EAN_8,
                Html5QrcodeSupportedFormats.QR_CODE
            ],
            experimentalFeatures: { useBarCodeDetectorIfSupported: false }
        });

        const cameraSelect = document.getElementById("camera-select");
        const statusText = document.getElementById("status-text");
        const lastScannedText = document.getElementById("last-scanned");
        const continuousCheckbox = document.getElementById("continuous-mode");

        // Zet 'Doorlopend' automatisch aan als de URL ?mode=continuous bevat
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('mode') === 'continuous') {
            continuousCheckbox.checked = true;
        }

        let isPaused = false;
        let scanCount = 0;

        function playBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                osc.frequency.value = 1000;
                osc.connect(ctx.destination);
                osc.start();
                setTimeout(() => osc.stop(), 100);
            } catch (e) {}
        }

        function closeScanner() {
            html5QrCode.stop().then(() => window.close()).catch(() => window.close());
        }

        function onScanSuccess(decodedText) {
            if (isPaused) return;

            playBeep();
            if (navigator.vibrate) navigator.vibrate(100);

            if (window.opener) {
                window.opener.postMessage({ type: 'VERTIRENT_BARCODE', code: decodedText }, '*');
            }

            // Als 'Doorlopend' UIT staat: sluit direct na 1 scan
            if (!continuousCheckbox.checked) {
                closeScanner();
                return;
            }

            // Als 'Doorlopend' AAN staat: pauzeer 2 seconden tegen dubbel scannen en ga door
            isPaused = true;
            scanCount++;
            lastScannedText.textContent = `✓ (${scanCount}x) Gescand: ${decodedText}`;
            statusText.textContent = "Even wachten voor volgende item...";

            setTimeout(() => {
                isPaused = false;
                statusText.textContent = "Klaar voor het volgende product...";
            }, 2000);
        }

        function startWithCamera(cameraIdOrConfig) {
            const config = {
                fps: 15,
                qrbox: function(viewfinderWidth, viewfinderHeight) {
                    return {
                        width: Math.floor(viewfinderWidth * 0.85),
                        height: Math.floor(viewfinderHeight * 0.45)
                    };
                }
            };

            html5QrCode.start(
                cameraIdOrConfig,
                config,
                onScanSuccess,
                () => {}
            ).then(() => {
                statusText.textContent = "Houd de streepjescode horizontaal in het kader (15-25 cm afstand)...";
            }).catch(err => {
                statusText.textContent = "Camera fout: " + err;
            });
        }

        function switchCamera() {
            const selectedId = cameraSelect.value;
            html5QrCode.stop().then(() => {
                startWithCamera(selectedId);
            });
        }

        Html5Qrcode.getCameras().then(devices => {
            if (devices && devices.length) {
                let preferredCamera = devices[0].id;
                devices.forEach(device => {
                    const option = document.createElement("option");
                    option.value = device.id;
                    option.text = device.label || `Camera ${cameraSelect.length + 1}`;
                    cameraSelect.appendChild(option);

                    const label = (device.label || "").toLowerCase();
                    if (label.includes("iphone") || label.includes("achter") || label.includes("back") || label.includes("environment")) {
                        preferredCamera = device.id;
                        cameraSelect.value = device.id;
                    }
                });
                startWithCamera(preferredCamera);
            } else {
                startWithCamera({ facingMode: "environment" });
            }
        }).catch(() => {
            startWithCamera({ facingMode: "environment" });
        });
    </script>
</body>
</html>
