<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VertiRENT Live Scanner</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { margin: 0; background: #090d16; color: #fff; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; height: 100vh; }
        header { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; background: #0f172a; border-bottom: 1px solid #1e293b; gap: 8px; }
        .btn-group { display: flex; gap: 8px; }
        button { border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; }
        .btn-switch { background: #1e293b; color: #fff; border: 1px solid #334155; }
        .btn-close { background: #ef4444; color: #fff; }
        #reader { width: 100%; flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        p { text-align: center; font-size: 13px; color: #94a3b8; padding: 12px; margin: 0; }
    </style>
</head>
<body>
    <header>
        <strong>VertiRENT Scanner</strong>
        <div class="btn-group">
            <button class="btn-switch" onclick="toggleCamera()">Wissel camera</button>
            <button class="btn-close" onclick="window.close()">Sluiten</button>
        </div>
    </header>
    <div id="reader"></div>
    <p id="status-text">Camera wordt gestart...</p>

    <script>
        const html5QrCode = new Html5Qrcode("reader", {
            formatsToSupport: [
                Html5QrcodeSupportedFormats.CODE_128,
                Html5QrcodeSupportedFormats.CODE_39,
                Html5QrcodeSupportedFormats.EAN_13,
                Html5QrcodeSupportedFormats.EAN_8,
                Html5QrcodeSupportedFormats.QR_CODE
            ]
        });

        const statusText = document.getElementById("status-text");
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        
        let currentFacingMode = "environment";
        let desktopCameras = [];
        let desktopCamIndex = 0;

        function onScanSuccess(decodedText) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                osc.frequency.value = 1000;
                osc.connect(ctx.destination);
                osc.start();
                setTimeout(() => osc.stop(), 100);
            } catch (e) {}

            if (window.opener) {
                window.opener.postMessage({ type: 'VERTIRENT_BARCODE', code: decodedText }, '*');
            }
            html5QrCode.stop().then(() => window.close());
        }

        function getScannerConfig() {
            return {
                fps: 15,
                qrbox: function(viewfinderWidth, viewfinderHeight) {
                    return {
                        width: Math.floor(viewfinderWidth * 0.85),
                        height: Math.floor(viewfinderHeight * 0.40)
                    };
                }
            };
        }

        function startScanner(cameraParam, labelName) {
            html5QrCode.start(
                cameraParam,
                getScannerConfig(),
                onScanSuccess,
                () => {}
            ).then(() => {
                statusText.textContent = labelName 
                    ? `Actief: ${labelName}` 
                    : "Richt de camera op een barcode of QR-code...";
            }).catch(err => {
                statusText.textContent = "Camera fout: " + err;
            });
        }

        function toggleCamera() {
            html5QrCode.stop().then(() => {
                if (isMobile) {
                    currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
                    startScanner({ facingMode: currentFacingMode });
                } else if (desktopCameras.length > 1) {
                    desktopCamIndex = (desktopCamIndex + 1) % desktopCameras.length;
                    const nextCam = desktopCameras[desktopCamIndex];
                    startScanner(nextCam.id, nextCam.label);
                }
            }).catch(() => {});
        }

        // Op iPhone: gebruik facingMode (voorkomt front-camera bug)
        // Op Mac: zoek automatisch naar de iPhone Continuïteitscamera
        if (isMobile) {
            startScanner({ facingMode: currentFacingMode });
        } else {
            Html5Qrcode.getCameras().then(devices => {
                desktopCameras = devices || [];
                if (desktopCameras.length > 0) {
                    const iphoneIdx = desktopCameras.findIndex(d => (d.label || "").toLowerCase().includes("iphone"));
                    desktopCamIndex = iphoneIdx !== -1 ? iphoneIdx : 0;
                    const chosen = desktopCameras[desktopCamIndex];
                    startScanner(chosen.id, chosen.label);
                } else {
                    startScanner({ facingMode: "environment" });
                }
            }).catch(() => {
                startScanner({ facingMode: "environment" });
            });
        }
    </script>
</body>
</html>
