<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VertiRENT Live Scanner</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { margin: 0; background: #090d16; color: #fff; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; height: 100vh; }
        header { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; background: #0f172a; border-bottom: 1px solid #1e293b; gap: 8px; }
        select { background: #1e293b; color: #fff; border: 1px solid #334155; padding: 6px 10px; border-radius: 6px; font-size: 13px; max-width: 200px; }
        button { background: #ef4444; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; }
        #reader { width: 100%; flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        p { text-align: center; font-size: 13px; color: #94a3b8; padding: 12px; margin: 0; }
    </style>
</head>
<body>
    <header>
        <strong>VertiRENT Scanner</strong>
        <select id="camera-select" onchange="switchCamera()"></select>
        <button onclick="window.close()">Sluiten</button>
    </header>
    <div id="reader"></div>
    <p id="status-text">Camera wordt gestart...</p>

    <script>
        const html5QrCode = new Html5Qrcode("reader", {
            formatsToSupport: [
                Html5QrcodeSupportedFormats.CODE_128,
                Html5QrcodeSupportedFormats.CODE_39,
                Html5QrcodeSupportedFormats.EAN_13,
                Html5QrcodeSupportedFormats.EAN_8,
                Html5QrcodeSupportedFormats.QR_CODE
            ],
            experimentalFeatures: { useBarCodeDetectorIfSupported: false }
        });

        const cameraSelect = document.getElementById("camera-select");
        const statusText = document.getElementById("status-text");

        function onScanSuccess(decodedText) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                osc.frequency.value = 1000;
                osc.connect(ctx.destination);
                osc.start();
                setTimeout(() => osc.stop(), 100);
            } catch (e) {}

            if (window.opener) {
                window.opener.postMessage({ type: 'VERTIRENT_BARCODE', code: decodedText }, '*');
            }
            html5QrCode.stop().then(() => window.close());
        }

        function startWithCamera(cameraIdOrConfig) {
            const config = {
                fps: 15,
                qrbox: function(viewfinderWidth, viewfinderHeight) {
                    return {
                        width: Math.floor(viewfinderWidth * 0.85),
                        height: Math.floor(viewfinderHeight * 0.45)
                    };
                }
            };

            html5QrCode.start(
                cameraIdOrConfig,
                config,
                onScanSuccess,
                () => {}
            ).then(() => {
                statusText.textContent = "Houd de streepjescode horizontaal in het kader (15-25 cm afstand)...";
            }).catch(err => {
                statusText.textContent = "Camera fout: " + err;
            });
        }

        function switchCamera() {
            const selectedId = cameraSelect.value;
            html5QrCode.stop().then(() => {
                startWithCamera(selectedId);
            });
        }

        Html5Qrcode.getCameras().then(devices => {
            if (devices && devices.length) {
                let preferredCamera = devices[0].id;
                devices.forEach(device => {
                    const option = document.createElement("option");
                    option.value = device.id;
                    option.text = device.label || `Camera ${cameraSelect.length + 1}`;
                    cameraSelect.appendChild(option);

                    const label = (device.label || "").toLowerCase();
                    if (label.includes("iphone") || label.includes("achter") || label.includes("back") || label.includes("environment")) {
                        preferredCamera = device.id;
                        cameraSelect.value = device.id;
                    }
                });
                startWithCamera(preferredCamera);
            } else {
                startWithCamera({ facingMode: "environment" });
            }
        }).catch(() => {
            startWithCamera({ facingMode: "environment" });
        });
    </script>
</body>
</html>
